name: Update Profile Art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GitHub contributions
        env:
          GITHUB_USERNAME: SrujanAgrasale01
        run: |
          python scripts/fetch_contributions.py

      - name: Generate contribution animation
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contrib-heatmap.svg data/contributions.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution animation"
            git push
          fi
