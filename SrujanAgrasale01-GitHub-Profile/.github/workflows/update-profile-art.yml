name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GITHUB_USERNAME: SrujanAgrasale01
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution animation"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
